{% extends "base.html" %}
{% block content %}
<h1>Audit log</h1>
<table>
  <tr><th>When</th><th>Who</th><th>Action</th><th>Entity</th><th>Detail</th></tr>
  {% for row in rows %}
  <tr><td>{{ row.created_at }}</td><td>{{ row.user_name or '—' }}</td><td>{{ row.action }}</td><td>{{ row.entity }} {{ row.entity_id }}</td><td>{{ row.detail }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
