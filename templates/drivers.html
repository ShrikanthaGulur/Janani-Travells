{% extends "base.html" %}
{% block content %}
<h1>Drivers</h1>
<form class="filters" method="get">
  <input name="q" value="{{ q }}" placeholder="Name, phone, or licence">
  <button>Filter</button>
</form>
<table>
  <tr><th>Name</th><th>Phone</th><th>Licence</th><th>Expiry</th><th>Monthly salary</th></tr>
  {% for d in drivers %}
  <tr>
    <td><a href="{{ url_for('driver_detail', driver_id=d.id) }}">{{ d.name }}</a></td>
    <td>{{ d.phone }}</td><td>{{ d.dl_number }}</td><td>{{ d.dl_expiry or '—' }}</td>
    <td>₹{{ '%.0f'|format(d.monthly_salary) }}</td>
  </tr>
  {% endfor %}
</table>
<h2>Add a driver</h2>
<form method="post" enctype="multipart/form-data" class="form-grid">
  <label>Name<input name="name" required></label>
  <label>Phone<input name="phone" required></label>
  <label>Address<input name="address"></label>
  <label>DL number<input name="dl_number"></label>
  <label>DL expiry<input type="date" name="dl_expiry"></label>
  <label>Monthly salary<input type="number" step="0.01" name="monthly_salary" value="0"></label>
  <label>DL copy<input type="file" name="dl_copy" accept=".pdf,.png,.jpg,.jpeg,.webp"></label>
  <button>Save driver</button>
</form>
{% endblock %}
