{% extends "base.html" %}
{% block content %}
<h1>Fuel</h1>
<form method="post" class="form-grid" id="fuel-form">
  <label>Vehicle
    <select name="vehicle_id" required>
      {% for v in vehicles %}<option value="{{ v.id }}" {% if vehicle_id==v.id|string %}selected{% endif %}>{{ v.number }} · {{ v.model }}</option>{% endfor %}
    </select>
  </label>
  <label>Date<input type="date" name="entry_date" value="{{ today }}" required></label>
  <label>Litres<input type="number" step="0.01" name="litres" required></label>
  <label>Cost<input type="number" step="0.01" name="cost" required></label>
  <label>Odometer KM<input type="number" step="0.1" name="km_reading" required></label>
  <button>Save fuel entry</button>
</form>
<p class="hint" id="offline-note"></p>
<form class="filters" method="get">
  <select name="vehicle_id"><option value="">All vehicles</option>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.number }}</option>{% endfor %}</select>
  <input type="date" name="start" value="{{ start }}">
  <input type="date" name="end" value="{{ end }}">
  <button>Filter</button>
</form>
<table>
  <tr><th>Date</th><th>Vehicle</th><th>Litres</th><th>Cost</th><th>KM</th></tr>
  {% for row in rows %}<tr><td>{{ row.entry_date }}</td><td>{{ row.number }}</td><td>{{ row.litres }}</td><td>₹{{ '%.0f'|format(row.cost) }}</td><td>{{ row.km_reading }}</td></tr>{% endfor %}
</table>
{% endblock %}
